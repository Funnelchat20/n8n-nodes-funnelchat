# Publishes this n8n community node package to npm on every version tag push.
#
# Starting May 1 2026, n8n requires all community nodes to be published via
# GitHub Actions with npm provenance statements. This workflow satisfies that
# requirement. Provenance lets anyone cryptographically verify that a package
# was built by this exact workflow, from this exact repository and commit.
#
# Based on the template scaffolded by `n8n-node release --init-workflow`
# (@n8n/node-cli 0.52.4), with "v" tags, a check that the tagged commit is in
# main and that the tag matches the version in package.json, a skip when that
# version is already on npm, the tests before publishing, pre-releases under
# the npm dist-tag `next`, and npm Trusted Publishing instead of a token.
#
# ─── ONE-TIME SETUP ────────────────────────────────────────────────────────────
#
# On npmjs.com, open the package settings and add a Trusted Publisher:
# GitHub Actions, organization Funnelchat20, this repository, workflow
# publish.yml, no environment. npm then accepts a publish only through an OIDC
# token minted for this workflow, so no npm secret is stored in GitHub, and
# provenance is generated automatically. The repository must be public for npm
# to accept provenance.
#
# ─── RELEASE PROCESS ───────────────────────────────────────────────────────────
#
# Set the version in package.json, commit it on main, then tag that commit and
# push the tag:
#
#   git tag v0.1.0 && git push origin v0.1.0
#
# The run fails before publishing if the tagged commit is not in main or the
# tag does not match the version. Then it checks the generated files and runs
# the tests; `npm run release` lints, builds and publishes.
#
# A pre-release (v0.4.0-rc.1, v0.4.0-beta.2: any version with a "-") goes out
# with the npm dist-tag `next`, so `npm install` keeps getting the last stable
# version; a stable one goes out as `latest`.
#
# ─── DRY RUN ───────────────────────────────────────────────────────────────────
#
# Running the workflow by hand (workflow_dispatch) publishes nothing: it only
# checks that npm accepts this workflow's OIDC token for the package.

name: Publish

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

# Never two runs for the same tag at once; a queued run finds the version
# already published and stops.
concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest

    permissions:
      # Required to mint the OIDC token npm Trusted Publishing exchanges, and
      # to sign the provenance attestation.
      id-token: write
      # Scoped down from the default (write) for least-privilege publishing.
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, to tell whether the tagged commit is in main.
          fetch-depth: 0

      - name: Tagged commit is in main
        if: github.event_name == 'push'
        run: |
          COMMIT="$(git rev-parse "${GITHUB_REF}^{commit}")"
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$COMMIT" origin/main; then
            echo "::error::Tag $GITHUB_REF_NAME points to $COMMIT, which is not in main: nothing is published"
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org/'

      - name: Update npm
        # Trusted Publishing needs npm 11.5.1 or newer. Not `latest`: npm 12
        # may require Node versions the runners do not guarantee yet.
        run: npm install -g npm@^11.5.1

      - name: Check Trusted Publishing (dry run)
        if: github.event_name == 'workflow_dispatch'
        # Neither token is printed nor stored: the GitHub token is masked, and
        # the npm token in the exchange response is discarded.
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          ENCODED_NAME="${PACKAGE_NAME//\//%2f}"
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ] || [ -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]; then
            echo "::error::No OIDC token available: the job needs the id-token: write permission"
            exit 1
          fi
          ID_TOKEN="$(curl -sS --fail \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" | jq -r '.value // empty')"
          if [ -z "$ID_TOKEN" ]; then
            echo "::error::GitHub did not return an OIDC token"
            exit 1
          fi
          echo "::add-mask::$ID_TOKEN"
          HTTP_CODE="$(curl -sS -o /dev/null -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $ID_TOKEN" \
            "https://registry.npmjs.org/-/npm/v1/oidc/token/exchange/package/$ENCODED_NAME")"
          if [ "${HTTP_CODE:0:1}" != "2" ]; then
            echo "::error::Trusted publishing failed for $PACKAGE_NAME: HTTP $HTTP_CODE"
            exit 1
          fi
          echo "Trusted publishing OK for $PACKAGE_NAME"

      - name: Tag matches package.json version
        if: github.event_name == 'push'
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PACKAGE_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PACKAGE_VERSION"
            exit 1
          fi

      - name: npm dist-tag
        id: channel
        if: github.event_name == 'push'
        run: |
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          case "$PACKAGE_VERSION" in
            *-*) DIST_TAG=next ;;
            *) DIST_TAG=latest ;;
          esac
          echo "::notice::$PACKAGE_VERSION goes out with the npm dist-tag $DIST_TAG"
          echo "dist_tag=$DIST_TAG" >> "$GITHUB_OUTPUT"

      - name: Version not published yet
        id: published
        if: github.event_name == 'push'
        run: |
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          if [ "$(npm view "$PACKAGE_NAME@$PACKAGE_VERSION" version 2>/dev/null || true)" = "$PACKAGE_VERSION" ]; then
            echo "::notice::$PACKAGE_NAME@$PACKAGE_VERSION is already on npm; nothing to publish"
            echo "already=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install dependencies
        if: github.event_name == 'push' && steps.published.outputs.already != 'true'
        run: npm ci

      - name: Generated files are up to date
        if: github.event_name == 'push' && steps.published.outputs.already != 'true'
        run: npm run generate -- --check

      - name: Test
        if: github.event_name == 'push' && steps.published.outputs.already != 'true'
        run: npm test

      - name: Release
        if: github.event_name == 'push' && steps.published.outputs.already != 'true'
        # In GitHub Actions, `n8n-node release` runs lint and build, then
        # `npm publish` with NPM_CONFIG_PROVENANCE=true and this environment, so
        # NPM_CONFIG_TAG is the dist-tag it publishes under. npm authenticates
        # through Trusted Publishing.
        env:
          NPM_CONFIG_TAG: ${{ steps.channel.outputs.dist_tag }}
        run: npm run release
